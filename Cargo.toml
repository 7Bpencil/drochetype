[package]
name = "drochetype"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "drochetype"

[[bin]]
name = "serializer"

[lib]
name = "common"
path = "src/common/lib.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ratatui = "0.30.0"
crossterm = "0.29.0"
rand = "0.9.2"
spdlog-rs = "0.5.2"
anyhow = "1.0.100"
rmp-serde = "1.3.1"
serde_bytes = "0.11.19"
miniz_oxide = "0.9.0"
rayon = "1.11"
